x-db-environment: &db-environment
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

x-db-common: &db-common
  environment: *db-environment
  restart: unless-stopped
  shm_size: 256mb
  healthcheck:
    test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s

services:
  coordinator:
    <<: *db-common
    image: ${CITUS_IMAGE}
    command: &citus-command ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "${CITUS_PORT}:5432"
    volumes:
      - coordinator_data:/var/lib/postgresql
  worker-1:
    <<: *db-common
    image: ${CITUS_IMAGE}
    command: *citus-command
    volumes:
      - worker_1_data:/var/lib/postgresql

  worker-2:
    <<: *db-common
    image: ${CITUS_IMAGE}
    command: *citus-command
    volumes:
      - worker_2_data:/var/lib/postgresql
  worker-3:
    <<: *db-common
    image: ${CITUS_IMAGE}
    command: *citus-command
    profiles: ["scale"]
    volumes:
      - worker_3_data:/var/lib/postgresql

  baseline:
    <<: *db-common
    image: ${POSTGRES_IMAGE}
    ports:
      - "${BASELINE_PORT}:5432"
    volumes:
      - baseline_data:/var/lib/postgresql

  citus-exporter:
    profiles: ["monitoring"]
    build: ./monitoring
    environment: *db-environment
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/citus.yml:ro
      - ./monitoring/grafana/cluster_dashboard.json:/var/lib/grafana/dashboards/cluster.json:ro

volumes:
  coordinator_data:
  worker_1_data:
  worker_2_data:
  worker_3_data:
  baseline_data:
  prometheus_data:
  grafana_data:
