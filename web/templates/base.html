<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Стенд Citus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Стенд PostgreSQL и Citus</h1>
    <nav aria-label="Основная навигация">
      <a href="{{ url_for('index') }}">Сводка</a>
      <a href="{{ url_for('data') }}">Данные</a>
      <a href="{{ url_for('cluster') }}">Кластер</a>
      <a href="{{ url_for('checks') }}">Проверки</a>
      <a href="http://localhost:3000/d/citus-cluster">Мониторинг</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p role="alert" class="message message-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
